name = "llm-gateway"
compatibility_date = "2026-06-29"
keep_vars = true

# ponytail: keep this file local-only for `wrangler pages dev`.
# Do not set `pages_build_output_dir` here, so Pages production config stays managed in Cloudflare.
# Configure production Variables / Secrets in the Workers & Pages dashboard instead.
# Required runtime secret: ADMIN_TOKEN. Supported optional names: API_KEY_CRYPT_SECRET, REQUEST_TIMEOUT_MS,
# STREAM_IDLE_TIMEOUT_MS, SSE_KEEPALIVE_MS, UPSTREAM_COOLDOWN_TTL, MODEL_CACHE_TTL, UPSTREAMS_JSON, CLIENTS_JSON,
# GLOBAL_ROUTE_COORDINATION is retained as a harmless legacy variable.
# For Pages production, add a Cron Trigger "0 */6 * * *" in the dashboard so the
# scheduled upstream health probe (health:probe:last) runs automatically.

# Optional local binding for `wrangler pages dev`.
# [[kv_namespaces]]
# binding = "KV"
# id = "<YOUR_KV_NAMESPACE_ID>"

# Recommended: bind D1 as `llmerge` and apply d1_migrations/0001_create_store.sql.
# [[d1_databases]]
# binding = "llmerge"
# database_name = "llmmerge"
# database_id = "<YOUR_D1_DATABASE_ID>"
# migrations_dir = "d1_migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LlmMergeStore"]

# Paid plan: raise the per-invocation fetch/KV/D1/DO subrequest ceiling.
# Free plans keep Cloudflare's platform maximum instead.
