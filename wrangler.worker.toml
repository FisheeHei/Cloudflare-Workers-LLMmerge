name = "llm-merge-worker"
main = "_worker.js"
compatibility_date = "2026-07-30"

# Run the automatic upstream health probe every 6 hours. The snapshot is stored
# in D1/KV under health:probe:last and shown by the admin panel.
[triggers]
crons = ["0 */6 * * *"]

# Bind the same KV namespace used by the gateway before deploying this Worker.
# [[kv_namespaces]]
# binding = "KV"
# id = "<YOUR_KV_NAMESPACE_ID>"

# Recommended: D1 primary storage. Binding name must be `llmerge`.
# [[d1_databases]]
# binding = "llmerge"
# database_name = "llmmerge"
# database_id = "<YOUR_D1_DATABASE_ID>"
# migrations_dir = "d1_migrations"

# Alternative for Worker deployments: Durable Object storage. Binding name must be `llmerge`.
# [[durable_objects.bindings]]
# name = "llmerge"
# class_name = "LlmMergeStore"

# Optional: cross-edge upstream dispatch spacing. If omitted, routing remains isolate-local.
# [[durable_objects.bindings]]
# name = "ROUTE_COORDINATOR"
# class_name = "LlmMergeStore"

# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["LlmMergeStore"]
